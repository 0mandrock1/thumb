/* Source: https://files.mandrock.me/web/mandrock0-tokens.css */
/*
 * mandrock0 design tokens — extracted verbatim from 0mandrock1/designClaude
 * (src/index.css, commit fac28d4). Dark-only: there is no light palette in
 * this system, :root already holds the dark values, .dark is a no-op alias.
 * Self-contained: drop into any project, no Tailwind/build step required.
 */

:root {
  /* ---- UA theme: tell the browser this is a dark page ----
     without it iOS Safari treats the page as light: white overscroll,
     white form controls/scrollbars, light toolbar tint in both modes */
  color-scheme: dark;

  /* ---- radii ---- */
  --radius: 0.625rem;
  --radius-card: 0.25rem;
  --radius-control: 1rem;
  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) + 4px);
  --radius-2xl: calc(var(--radius) * 1.8);
  --radius-3xl: calc(var(--radius) * 2.2);
  --radius-4xl: calc(var(--radius) * 2.6);

  /* ---- brand accents (raw) ---- */
  --accent-purple: oklch(70% .30 320);
  --accent-cyan: oklch(80% .15 205);
  --accent-lime: oklch(86% .21 150);
  --accent-crimson: oklch(60% .23 13);
  --accent-shader: var(--accent-purple);

  /* ---- role layer (semantic aliases onto the accents) ---- */
  --action: var(--accent-purple);
  --info: var(--accent-cyan);
  --ok: var(--accent-lime);
  --alive: var(--accent-crimson);

  /* ---- surface / text colors (shadcn semantic layer) ---- */
  --background: oklch(11% .105 14);
  --foreground: oklch(96% .035 20);
  --card: oklch(16.5% .125 12);
  --card-foreground: var(--foreground);
  --popover: oklch(16.5% .125 12);
  --popover-foreground: var(--foreground);
  --primary: var(--accent-shader);
  --primary-foreground: oklch(10% .04 356);
  --secondary: oklch(23.5% .14 12);
  --secondary-foreground: var(--foreground);
  --muted: oklch(20% .13 12);
  --muted-foreground: oklch(70% .095 16);
  --accent: var(--accent-shader);
  --accent-foreground: oklch(10% .04 356);
  --destructive: oklch(70% .18 38);

  /* ---- borders / outlines / focus ring ---- */
  --border: oklch(33% .16 10 / .55);
  --input: oklch(33% .16 10 / .7);
  --ring: var(--accent-shader);

  /* ---- glow / shadow system (one hue, three strengths) ---- */
  --glow: var(--accent-shader);
  --glow-ambient: 0 0 0 1px color-mix(in oklch, var(--glow) 14%, transparent);
  --glow-attention: 0 0 0 1px color-mix(in oklch, var(--glow) 55%, transparent),
                     0 0 20px color-mix(in oklch, var(--glow) 40%, transparent);
  --glow-interaction: 0 0 0 1.5px color-mix(in oklch, var(--glow) 85%, transparent),
                       0 0 28px color-mix(in oklch, var(--glow) 60%, transparent);

  /* ---- chart palette ---- */
  --chart-1: oklch(0.87 0 0);
  --chart-2: oklch(0.556 0 0);
  --chart-3: oklch(0.439 0 0);
  --chart-4: oklch(0.371 0 0);
  --chart-5: oklch(0.269 0 0);

  /* ---- sidebar ---- */
  --sidebar: oklch(0.205 0 0);
  --sidebar-foreground: oklch(0.985 0 0);
  --sidebar-primary: var(--accent-shader);
  --sidebar-primary-foreground: oklch(10% .04 356);
  --sidebar-accent: oklch(0.269 0 0);
  --sidebar-accent-foreground: oklch(0.985 0 0);
  --sidebar-border: oklch(1 0 0 / 10%);
  --sidebar-ring: var(--accent-shader);

  /* ---- typography ---- */
  --font-sans: 'Geist Variable', sans-serif;
  --font-heading: var(--font-sans);

  /* ---- motion gate (a11y: prefers-reduced-motion drives this to 0) ---- */
  --glitch-budget: 1;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --glitch-budget: 0;
  }
}

</style>
<style>
/* Source: https://tools.mandrock.me/palettes/accents.css */
/* mandrock0 page accents — рантайм-шар поверх mandrock0-tokens.css

 * Використання:  <html data-accent="lime">

<style>

.tabs button[aria-current="true"]{border-color:var(--page-accent,#eb2450);background:color-mix(in oklch,var(--page-accent,#eb2450) 22%,var(--background,#140509));box-shadow:inset 0 -2px var(--page-accent,#eb2450)}

.cell[aria-pressed="true"]{border-color:var(--page-accent,#eb2450);background:color-mix(in oklch,var(--page-accent,#eb2450) 42%,var(--background,#140509));color:var(--foreground,#f8e8ed)}
.field{position:absolute;inset:0;width:100%;height:100%;display:block}
#sandShake{position:absolute;z-index:3;right:12px;bottom:10px}

.ball{position:absolute;top:0;left:0;width:33px;height:33px;border-radius:50%;background:radial-gradient(circle at 34% 26%,var(--foreground,#f8e8ed),var(--page-accent,#eb2450) 30%,var(--background,#140509) 70%);box-shadow:0 0 22px var(--page-accent,#eb2450);pointer-events:none}
.track{position:absolute;inset:14px;border:1px dashed var(--border,#542531);border-radius:24px;pointer-events:none;background:radial-gradient(circle,color-mix(in oklch,var(--page-accent,#eb2450) 28%,transparent) 1px,transparent 1px) center/14px 14px}
#cubeMoves{min-height:2lh;max-width:30ch;font:1rem/1.35 ui-monospace,monospace;overflow-wrap:anywhere}

<body><div class="shell">
<header><h1>Thumb</h1><span>Без звуку</span></header>
<main>
<div class="intro"><h2 id="modeName">Пульс</h2><p id="modeHint" class="caption">Відбивай темп одним пальцем. Після паузи почнеться нова серія.</p></div>
<section class="panel" id="pulse" aria-labelledby="modeName">
<button class="pad" id="tap" aria-label="Відбити удар"><span class="disc" id="disc" aria-hidden="true">⊕</span><span class="meter" id="pulseStat">Почни в будь-якому темпі</span></button>
</section>
<section class="panel" id="loop" aria-labelledby="modeName" hidden>
<div class="area pointer" id="loopPad" tabindex="0" aria-label="Поле свайпів. Також працюють стрілки клавіатури."><div class="stack"><span class="loop-ring" id="loopArrow" aria-hidden="true">↑</span><span class="meter" id="loopStat" role="status">Готово кіл: 0</span></div></div>
</section>
<section class="panel" id="glitch" aria-labelledby="modeName" hidden>
<canvas id="glitchPad" class="field pointer" tabindex="0" role="button" aria-label="Випадковий глітч. Enter або пробіл."></canvas>
<span class="caption overlay" id="glitchStat" role="status">200 ефектів</span>
</section>
<section class="panel" id="roll" aria-labelledby="modeName" hidden>
<div class="field pointer" id="rollPad" tabindex="0" aria-label="Поле кульки. Також працюють стрілки клавіатури."><div class="track"></div><span class="ball" id="ball"></span></div>
</section>
<section class="panel" id="count" aria-labelledby="modeName" hidden>
<div class="area"><div class="stack"><button class="pad" id="increment" aria-label="Додати один"><span class="disc number" id="number" aria-live="polite">0</span></button><div class="stepper"><button class="small" id="decrement" aria-label="Відняти один">−1</button><button class="small" id="resetCount">Скинути</button></div></div></div>
</section>
<section class="panel" id="knot" aria-labelledby="modeName" hidden>
<div class="area"><div class="stack"><div class="grid" id="grid" aria-label="Поле три на три"></div><div class="meter" id="knotStat" role="status"></div><button class="small" id="nextKnot">Інший вузол</button></div></div>
</section>
<section class="panel" id="cube" aria-labelledby="modeName" hidden>
<div class="area"><div class="stack"><strong id="cubeName"></strong><span id="cubeMoves" role="status"></span><div class="stepper"><button class="small" id="cubeReveal">Наступний хід</button><button class="small" id="cubeNext">Інша картка</button></div></div></div>
</section>
<section class="panel" id="test" aria-labelledby="modeName" hidden>

<span class="caption overlay" id="sandStat">Піщинок: 0</span>
<button class="small" id="sandShake">Струсити</button>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const modes = {
  pulse: ['Пульс', 'Відбивай темп одним пальцем. Після паузи почнеться нова серія.'],
  loop: ['Петля', 'Свайпай за стрілкою: вгору, праворуч, униз, ліворуч. У своєму темпі.'],
  glitch: ['Глітч', 'Торкнись для нового ефекту. Проведи пальцем, щоб лишити слід.'],
  roll: ['Перекат', 'Підхопи кульку, проведи й відпусти. Вона покотиться за інерцією.'],
  count: ['Лічильник', 'Торкнись числа, щоб додати один. Значення лишається між візитами.'],
  knot: ['Вузол', 'Погаси всі клітинки. Дотик перемикає клітинку та її сусідів по хресту.'],
  cube: ['Кубик', 'Пригадай алгоритм 3×3 і відкривай по одному ходу.'],
  test: ['TEST', 'Веди пальцем — сиплеться пісок. Колір міняється шарами, купа лишається між візитами.'],
};
function read(key) {
  try { return localStorage.getItem('thumb.v1.' + key); } catch { return null; }
}
function save(key, value) {
  try { localStorage.setItem('thumb.v1.' + key, value); } catch {}
}
function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
const tabs = Object.entries(modes).map(([id, [name]]) => {
  const button = document.createElement('button');
  button.textContent = name;
  button.setAttribute('aria-controls', id);
  button.onclick = () => select(id);
  $('tabs').append(button);
  return [id, button];
});
let mode;
function select(id) {
  if (mode === id) return;
  mode = id;
  for (const [key, button] of tabs) {
    $(key).hidden = key !== id;
    button.setAttribute('aria-current', String(key === id));
  }
  [$('modeName').textContent, $('modeHint').textContent] = modes[id];
  save('mode', id);
  if (id === 'glitch') paintGlitchField();
  else if (id === 'roll') placeBall();
  else if (id === 'test') sandShow();
}

let lastTap = 0;
let intervals = [];
let hitTimer;
$('tap').onclick = () => {
  const now = performance.now();
  const interval = now - lastTap;
  if (lastTap && interval < 115) return;
  if (!lastTap || interval > 2200) intervals = [];
  else intervals = [...intervals.slice(-7), interval];
  lastTap = now;
  const average = intervals.reduce((sum, value) => sum + value, 0) / intervals.length;
  const deviation = intervals.reduce((sum, value) => sum + Math.abs(value - average), 0) / intervals.length;
  const pace = Math.round(60000 / average);
  $('pulseStat').textContent = intervals.length >= 3
    ? pace + ' BPM · відхилення ' + Math.round(deviation) + ' мс'
    : intervals.length ? pace + ' BPM' : 'Ще один удар';
  $('disc').classList.add('hit');
  clearTimeout(hitTimer);
  hitTimer = setTimeout(() => $('disc').classList.remove('hit'), 110);
};

const directions = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'];
let step = 0;
let loops = 0;
function follow(direction) {
  if (directions[step] !== direction) return;
  step = (step + 1) % 4;
  if (!step) loops++;
  $('loopArrow').textContent = ['↑', '→', '↓', '←'][step];
  $('loopStat').textContent = 'Готово кіл: ' + loops;
}
let swipe;
$('loopPad').onpointerdown = (event) => {
  if (!event.isPrimary || event.button !== 0) return;
  swipe = { x: event.clientX, y: event.clientY, id: event.pointerId };
  event.currentTarget.setPointerCapture(event.pointerId);
};
$('loopPad').onpointerup = (event) => {
  if (swipe?.id !== event.pointerId) return;
  const dx = event.clientX - swipe.x;
  const dy = event.clientY - swipe.y;
  swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 23) return;
  follow(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
};
$('loopPad').onlostpointercapture = () => { swipe = null; };
$('loopPad').onkeydown = (event) => {
  if (!directions.includes(event.key)) return;
  event.preventDefault();
  if (!event.repeat) follow(event.key);
};

let count = Number(read('count'));
if (!Number.isSafeInteger(count) || count < 0 || count > 999999) count = 0;
function updateCount(value) {
  count = Math.max(0, Math.min(999999, value));
  $('number').style.fontSize = count >= 1000 ? '2rem' : '';
  $('number').textContent = count;
  $('decrement').disabled = count === 0;
  save('count', count);
}
$('increment').onclick = () => updateCount(count + 1);
$('decrement').onclick = () => updateCount(count - 1);
$('resetCount').onclick = () => updateCount(0);
updateCount(count);

const crosses = Array.from({ length: 9 }, (_, i) => Array.from({ length: 9 }, (_, j) => j)
  .filter((j) => Math.abs(i % 3 - j % 3) + Math.abs(Math.floor(i / 3) - Math.floor(j / 3)) <= 1)
  .reduce((mask, j) => mask | (1 << j), 0));
let knot;
let previousKnot;
const cells = crosses.map((cross, i) => {
  const cell = document.createElement('button');
  cell.className = 'cell';
  cell.setAttribute('aria-label', 'Рядок ' + (Math.floor(i / 3) + 1) + ', стовпець ' + (i % 3 + 1));
  cell.onclick = () => { if (knot) { knot ^= cross; showKnot(); } };
  $('grid').append(cell);
  return cell;
});
function showKnot() {
  for (const [i, cell] of cells.entries()) {
    const lit = Boolean(knot & (1 << i));
    cell.setAttribute('aria-pressed', String(lit));
    cell.textContent = lit ? '◆' : '·';

  fieldHeight = height;

    y: clamp(y / fieldHeight, .04, .96),

}
canvas.onpointerdown = (event) => {
  if (!event.isPrimary || event.button !== 0) return;

  const y = event.clientY - rect.top;

};
canvas.onpointermove = (event) => {

  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

canvas.onlostpointercapture = () => { gesture = null; };
canvas.onkeydown = (event) => {

};
new ResizeObserver(() => {
  if (mode === 'glitch') {
    if (reduced.matches && marks.length) showGlitch(performance.now());

}).observe($('pulse').parentElement);

const sandCv = $('sandPad');
const sandCtx = sandCv.getContext('2d');
const SW = 60;
const sandFallback = [[239, 73, 114], [241, 90, 191], [76, 209, 227], [184, 237, 135]];
let SH = 0, sandCells = null, sandBuf = null, sandImg = null, sandRgb = null;
let sandFrame = 0, sandPour = null, sandLayer = 0, sandPoured = 0, sandFlip = false;
function sandColors() {
  try {
    const probe = document.createElement('span');
    const pc = document.createElement('canvas');
    pc.width = pc.height = 1;
    const p = pc.getContext('2d', { willReadFrequently: true });
    document.body.append(probe);
    const out = [1, 2, 3, 4].map((n, i) => {
      probe.style.color = `var(--ink-${n})`;
      p.clearRect(0, 0, 1, 1);
      p.fillStyle = '#000';
      p.fillStyle = getComputedStyle(probe).color;
      p.fillRect(0, 0, 1, 1);
      const d = p.getImageData(0, 0, 1, 1).data;

    probe.remove();
    return out;

}
function sandInit() {
  const w = sandCv.clientWidth, h = sandCv.clientHeight;
  if (!w || !h) return false;
  if (!sandCells) {
    let saved = null;
    try { saved = JSON.parse(read('sand') || 'null'); } catch {}
    const ok = saved && saved.w === SW && saved.d && saved.d.length === SW * saved.h;
    SH = ok ? saved.h : clamp(Math.round(SW * h / w), 40, 160);
    sandCells = new Uint8Array(SW * SH);
    if (ok) {
      for (let i = 0; i < saved.d.length; i++) sandCells[i] = clamp(saved.d.charCodeAt(i) - 48, 0, 4);
      sandLayer = saved.l | 0;
    }
    sandBuf = document.createElement('canvas');
    sandBuf.width = SW;
    sandBuf.height = SH;
    sandImg = sandBuf.getContext('2d').createImageData(SW, SH);
    sandRgb = sandColors();
  }
  const ratio = devicePixelRatio || 1;
  const cw = Math.round(w * ratio), ch = Math.round(h * ratio);
  if (sandCv.width !== cw || sandCv.height !== ch) { sandCv.width = cw; sandCv.height = ch; }
  return true;
}
function sandStep() {
  let moved = 0;
  sandFlip = !sandFlip;
  for (let y = SH - 2; y >= 0; y--) {
    for (let k = 0; k < SW; k++) {
      const x = sandFlip ? k : SW - 1 - k;
      const i = y * SW + x, c = sandCells[i];
      if (!c) continue;
      const b = i + SW;
      if (!sandCells[b]) { sandCells[b] = c; sandCells[i] = 0; moved++; continue; }
      const dir = Math.random() < .5 ? -1 : 1;
      for (const dx of [dir, -dir]) {
        const nx = x + dx;
        if (nx < 0 || nx >= SW) continue;
        if (!sandCells[b + dx] && !sandCells[i + dx]) { sandCells[b + dx] = c; sandCells[i] = 0; moved++; break; }
      }
    }
  }
  return moved;
}
function sandAdd() {
  if (!sandPour) return;
  const cx = Math.floor(sandPour.x * SW), cy = Math.floor(sandPour.y * SH);
  const color = 1 + (sandLayer % 4);
  for (let n = 0; n < 3; n++) {
    const x = clamp(cx + Math.round((Math.random() - .5) * 4), 0, SW - 1);
    const y = clamp(cy + Math.round((Math.random() - .5) * 2), 0, SH - 1);
    const i = y * SW + x;
    if (!sandCells[i]) { sandCells[i] = color; sandPoured++; }
  }
  if (sandPoured >= 160) { sandPoured = 0; sandLayer++; }
}
function sandDraw() {
  const d = sandImg.data;
  let count = 0;
  for (let i = 0; i < sandCells.length; i++) {
    const c = sandCells[i], o = i * 4;
    if (!c) { d[o + 3] = 0; continue; }
    const rgb = sandRgb[c - 1], shade = ((i * 2654435761) >>> 28) * 3;
    d[o] = Math.max(0, rgb[0] - shade);
    d[o + 1] = Math.max(0, rgb[1] - shade);
    d[o + 2] = Math.max(0, rgb[2] - shade);
    d[o + 3] = 255;
    count++;
  }
  sandBuf.getContext('2d').putImageData(sandImg, 0, 0);
  sandCtx.imageSmoothingEnabled = false;
  sandCtx.clearRect(0, 0, sandCv.width, sandCv.height);
  sandCtx.drawImage(sandBuf, 0, 0, sandCv.width, sandCv.height);
  $('sandStat').textContent = `Піщинок: ${count}`;
}
function sandSave() {
  let s = '';
  for (const c of sandCells) s += String.fromCharCode(48 + c);
  save('sand', JSON.stringify({ w: SW, h: SH, l: sandLayer, d: s }));
}
function sandTick() {
  sandFrame = 0;
  if (mode !== 'test' || !sandInit()) return;
  sandAdd();
  let moved = 0;
  const steps = reduced.matches ? SH : 2;
  for (let s = 0; s < steps; s++) { moved = sandStep(); if (!moved) break; }
  sandDraw();

function sandKick() { if (!sandFrame) sandFrame = requestAnimationFrame(sandTick); }

function sandAt(event) {

  return { x: clamp((event.clientX - r.left) / r.width, 0, .999), y: clamp((event.clientY - r.top) / r.height, 0, .999) };
}
sandCv.onpointerdown = (event) => {
  if (!event.isPrimary || event.button !== 0 || !sandInit()) return;

  sandCv.setPointerCapture(event.pointerId);

sandCv.onpointermove = (event) => { if (sandPour?.id === event.pointerId) Object.assign(sandPour, sandAt(event)); };
sandCv.onlostpointercapture = () => { sandPour = null; };
sandCv.onkeydown = (event) => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  if (!sandInit()) return;

  sandKick();

sandCv.onkeyup = () => { if (sandPour?.id === 'key') sandPour = null; };
$('sandShake').onclick = () => {
  if (!sandInit()) return;
  for (let i = 0; i < sandCells.length; i++) if (sandCells[i] && Math.random() < .5) sandCells[i] = 0;

new ResizeObserver(() => { if (mode === 'test' && sandInit()) sandDraw(); }).observe(sandCv);
const initialMode = read('mode');
select(Object.hasOwn(modes, initialMode) ? initialMode : 'pulse');
